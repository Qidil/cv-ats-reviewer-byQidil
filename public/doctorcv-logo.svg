<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 64" fill="none">
  <title>Doctor CV</title>
  <!-- One stethoscope that spells the letters: the chestpiece ring is the C, the two earpiece tubes are the V. -->
